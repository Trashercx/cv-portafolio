name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Fase 6: si llegan varios pushes seguidos al mismo PR (o a main), se cancela
# el run anterior todavía en curso para no gastar minutos en resultados que
# ya nadie va a mirar. En main NO se cancela (cancel-in-progress=false) para
# que un build-and-push a medias nunca quede interrumpido por el siguiente
# commit: cada push a main publica su propia imagen completa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Fase 6: permisos mínimos por defecto para todo el workflow; los jobs que
# publican a GHCR piden `packages: write` de forma explícita más abajo.
permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # Fase 6: Postgres real para los tests e2e (test/*.e2e-spec.ts levantan
    # AppModule completo contra la base de datos — ver
    # apps/api/test/utils/test-app.ts). El servicio expone 5432 en el runner,
    # por eso DATABASE_URL apunta a localhost:5432 (no al 5433 de desarrollo
    # local de docker-compose.yml). Credenciales dummy, exclusivas de CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cv_ci
          POSTGRES_PASSWORD: cv_ci
          POSTGRES_DB: cv_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cv_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Mismas variables que apps/api/.env.example declara. Ninguna es real:
      # JWT_SECRET y ADMIN_PASSWORD_SEED solo viven en este runner efímero.
      # prisma7.config.ts, prisma/seed.ts y los e2e (dotenv/config) leen
      # process.env primero, y no existe ningún .env en CI que los pise.
      NODE_ENV: test
      PORT: "3000"
      DATABASE_URL: postgresql://cv_ci:cv_ci@localhost:5432/cv_ci?schema=public
      FRONTEND_ORIGIN: http://localhost:5173
      JWT_SECRET: secreto-exclusivo-de-ci-no-usar-en-produccion-0123456789
      JWT_EXPIRES_IN: 15m
      ADMIN_EMAIL: admin-ci@example.com
      ADMIN_PASSWORD_SEED: Contrasena-de-CI-123
      # Media: los e2e sustituyen S3MediaStorageService por el stub local
      # (overrideProvider en media.e2e-spec.ts y sitio-publico.e2e-spec.ts);
      # estos valores solo evitan que el provider real se construya vacío.
      AWS_ACCESS_KEY_ID: ci-dummy
      AWS_SECRET_ACCESS_KEY: ci-dummy
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: bucket-ci-dummy
      CLOUDFRONT_DOMAIN: ""
      PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run lint
      - run: npm run build
      # Unit tests con cobertura (jest --coverage); el reporte se sube como
      # artifact para consultarlo desde el run sin instalar nada.
      - run: npm run test:cov
      # Migraciones + seed (admin único y catálogos) contra el Postgres del
      # servicio, exactamente como lo haría el docker-entrypoint.sh en
      # producción, y luego los e2e reales (maxWorkers: 1, ver
      # test/jest-e2e.json).
      - name: Migraciones de Prisma (migrate deploy)
        run: npx prisma migrate deploy
      - name: Seed (admin único + catálogos)
        run: npx prisma db seed
      - name: Tests e2e
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-api
          path: apps/api/coverage
          retention-days: 7
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # --- CD (Sprint 5) ---------------------------------------------------
  # `needs: [api, web]` obliga a que ambos jobs de CI ya hayan pasado; por
  # eso el build-and-push vive en este mismo workflow y no en uno aparte
  # ("needs" no puede referenciar jobs de otro workflow). Solo corre en
  # push a main (nunca en pull_request) para no publicar imágenes por cada
  # PR abierto.
  build-and-push-api:
    needs: [api, web]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # cache-to: type=gha requiere el driver "docker-container" de
      # Buildx; el driver "docker" por defecto del runner no soporta
      # exportar caché y falla el build con "Cache export is not
      # supported for the docker driver".
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR exige el nombre del repositorio en minúsculas; github.repository
      # conserva las mayúsculas del owner/nombre real (Trashercx/cv-portafolio),
      # lo que hacía fallar el tag con "repository name must be lowercase".
      - name: Nombre de repo en minúsculas para el tag de GHCR
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/api:latest
            ghcr.io/${{ env.REPO_LC }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-web:
    needs: [api, web]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR exige el nombre del repositorio en minúsculas; github.repository
      # conserva las mayúsculas del owner/nombre real (Trashercx/cv-portafolio),
      # lo que hacía fallar el tag con "repository name must be lowercase".
      - name: Nombre de repo en minúsculas para el tag de GHCR
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # VITE_API_URL queda incrustado en el JS en tiempo de build (ver
          # apps/web/Dockerfile) — este secreto debe apuntar a la URL
          # pública real de la API en producción.
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL_PRODUCCION }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}/web:latest
            ghcr.io/${{ env.REPO_LC }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Paso opcional: si el repo tiene configurado un webhook de despliegue de
  # Dokploy/Coolify (secreto DEPLOY_WEBHOOK_URL), lo dispara después de
  # publicar ambas imágenes. Si el secreto no existe, este job se salta
  # solo (no rompe el pipeline) — activarlo es una decisión de
  # infraestructura posterior a este sprint, ver docs/despliegue.md.
  trigger-deploy:
    needs: [build-and-push-api, build-and-push-web]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar webhook de despliegue (si está configurado)
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "${DEPLOY_WEBHOOK_URL:-}" ]; then
            echo "DEPLOY_WEBHOOK_URL no está configurado; se omite el disparo automático de despliegue."
            exit 0
          fi
          curl -sf -X POST "$DEPLOY_WEBHOOK_URL"

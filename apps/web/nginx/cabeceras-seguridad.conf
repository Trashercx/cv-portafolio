# Fase 6 — cabeceras de seguridad de apps/web (se incluye desde
# default.conf.template a nivel de server y dentro de cada location que
# declara su propio `add_header`, porque nginx no hereda add_header entre
# niveles cuando el hijo define alguno).
#
# `always` hace que las cabeceras viajen también en respuestas 4xx/5xx.
# Este archivo NO pasa por envsubst: los orígenes externos llegan como
# variables de nginx ($csp_api_origin, $csp_media_origin) definidas con
# `set` en default.conf.template a partir de API_ORIGIN / MEDIA_ORIGIN.

# El navegador no "adivina" el tipo MIME de un recurso: un archivo subido
# que se sirva como texto nunca se ejecuta como script.
add_header X-Content-Type-Options "nosniff" always;

# Nadie puede embeber el sitio (ni el panel admin) en un <iframe> de otro
# origen — anti clickjacking. Equivale a `frame-ancestors 'self'` de la CSP,
# se mantiene por los navegadores viejos que no entienden esa directiva.
add_header X-Frame-Options "SAMEORIGIN" always;

# Enlaces salientes (redes sociales, PDFs en S3) solo reciben el origen,
# nunca la ruta completa (p. ej. /admin/editor), y nada si se baja a HTTP.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# El sitio no usa cámara, micrófono ni geolocalización: se apagan para
# todos los orígenes (incluido el propio) por si un script comprometido
# intentara pedirlos.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# HSTS: un año, incluyendo subdominios. TLS lo termina Traefik (Dokploy/
# Coolify) delante de este contenedor, que solo habla HTTP; el navegador
# IGNORA este header cuando lo recibe por HTTP plano, así que solo surte
# efecto una vez que el sitio se sirve por HTTPS desde el proxy. No lleva
# `preload` a propósito: entrar a la lista de precarga es irreversible.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content-Security-Policy. Cada directiva responde a un uso real detectado
# en apps/web/src (grep de iframe/embed/object/blob/fuentes/imágenes):
#
#   default-src 'self'
#       Todo lo que no se liste abajo solo puede venir del propio origen.
#   script-src 'self'
#       Vite emite <script type="module" src="/assets/...js"> sin scripts
#       inline ni eval; no hay CDN de terceros ni Web Workers externos.
#   style-src 'self' 'unsafe-inline'
#       Puck (@measured/puck) inyecta elementos <style> en runtime y copia
#       los estilos de la página al iframe del lienzo; los diálogos de
#       Radix/shadcn (react-remove-scroll) también crean <style> para
#       bloquear el scroll. Sin 'unsafe-inline' el editor y los modales se
#       rompen. (Los `style={{...}}` de React, p. ej. FondoAnimado.tsx y
#       las variables del Tema, van por CSSOM y no necesitan esta excepción.)
#   img-src 'self' data: blob: https:
#       Fotos de perfil, galería, logos de certificaciones y fondo vienen
#       de S3/CloudFront (https:); `blob:` cubre la previsualización local
#       antes de subir (MediaUploadField → URL.createObjectURL); `data:`
#       cubre SVG/íconos embebidos.
#   font-src 'self' data:
#       La única fuente es @fontsource-variable/manrope, autoalojada en
#       /assets (apps/web/src/index.css). Nada de Google Fonts.
#   connect-src 'self' $csp_api_origin
#       fetch() del panel y del sitio público solo hacia apps/api
#       (lib/api-client.ts). Debe coincidir con VITE_API_URL del build.
#   object-src 'self' blob: $csp_media_origin
#       MediaPreview.tsx incrusta el PDF del CV con <object type=
#       "application/pdf" data={url}> (decisión de Fase 4.1: Chrome bloquea
#       el visor dentro de <iframe sandbox>). `url` es la del archivo en
#       S3/CloudFront (MEDIA_ORIGIN) o un blob: local antes de subirlo.
#   frame-src 'self' $csp_media_origin
#       El lienzo de Puck es un <iframe> same-origin (about:blank, hereda
#       esta misma política); MEDIA_ORIGIN queda por si el visor de PDF
#       vuelve a usar <iframe>. No hay YouTube, mapas ni otros embeds.
#   frame-ancestors 'self'
#       Versión CSP del X-Frame-Options SAMEORIGIN.
#   base-uri 'self'
#       Nadie puede inyectar un <base href> que redirija rutas relativas.
#   form-action 'self'
#       Los formularios (React Hook Form) nunca hacen POST nativo a otro
#       origen; el login va por fetch a connect-src.
#   worker-src 'self' / manifest-src 'self'
#       Hoy no se usan; se fijan explícitamente para que un futuro
#       `new Worker()` o manifest no caiga en un default más laxo.
#
# Si una imagen externa no carga, el error aparece en la consola del
# navegador como "Refused to load ... because it violates the following
# Content Security Policy directive" — ver docs/despliegue.md, Fase 6.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' $csp_api_origin; object-src 'self' blob: $csp_media_origin; frame-src 'self' $csp_media_origin; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; worker-src 'self'; manifest-src 'self'" always;

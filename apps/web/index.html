<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fase 8 (UC-34, Lighthouse): el sitio público pide `GET /sitio` a otro
         origen (VITE_API_URL, que Vite sustituye aquí en tiempo de build) en
         cuanto arranca el JS; abrir la conexión TCP+TLS desde el HTML ahorra
         ~150 ms en móvil. `crossorigin` porque esos fetch van sin credenciales
         (`credentials: 'same-origin'`, lib/api-client.ts) y así comparten conexión. -->
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <!-- Fase 7m (Lighthouse): toda ruta pública pide `GET /sitio` nada más
         arrancar (useSitio), pero el fetch recién sale cuando el JS ya se
         descargó y ejecutó. Este preload lo lanza en paralelo con el JS y
         recorta ese escalón de la cascada (FCP/LCP). Para que el navegador
         reutilice la respuesta, el fetch tiene que coincidir en modo de
         credenciales: `crossorigin` (anónimo) ↔ `credentials: 'same-origin'`
         en lib/api-client.ts. En /admin/* sobra (21 KB una sola vez). -->
    <link rel="preload" href="%VITE_API_URL%/sitio" as="fetch" crossorigin />
    <!-- Fase 8 (UC-34): directiva SSI de nginx. En producción nginx la
         reemplaza por el fragmento que devuelve `GET /seo/metadatos` del API
         (title, description, canonical, Open Graph, Twitter card y JSON-LD
         de la ruta pública pedida), así los bots que no ejecutan JS ven
         metadatos reales. Si el API no responde, nginx deja el include vacío
         (`ssi_silent_errors`) y valen los metadatos estáticos de abajo. En
         desarrollo (Vite) es un comentario inerte. El Dockerfile de web
         comprueba tras el build que la directiva sigue en dist/index.html. -->
    <!--# include virtual="/_seo/metadatos" -->
    <!-- Fase 6: metadatos genéricos de respaldo; `MetadatosPagina` los
         reemplaza por los de cada página (por eso `data-meta-estatico`).
         El <title> va DESPUÉS del include (Fase 8): navegadores y bots usan
         el primer <title> del documento, que debe ser el del API.
         `theme-color` es estático por necesidad: el tema real llega por API
         en runtime, después del primer pintado. -->
    <title data-meta-estatico>Portafolio</title>
    <meta
      name="description"
      content="Portafolio profesional: proyectos, certificaciones, logros y datos de contacto."
      data-meta-estatico
    />
    <meta property="og:type" content="website" data-meta-estatico />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

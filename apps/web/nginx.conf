# Configuración mínima de nginx para servir el build estático de apps/web
# (SPA con React Router) — ver apps/web/Dockerfile.
#
# No hace proxy inverso a apps/api: eso se resuelve a nivel de
# Dokploy/Coolify o de un reverse proxy externo al contenedor. La URL de
# la API ya quedó incrustada en el JS en tiempo de build (VITE_API_URL),
# así que este servidor solo necesita entregar archivos estáticos.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Fallback de SPA: React Router maneja rutas de cliente como
  # /admin/perfil o /proyecto/:id que no existen como archivo físico en
  # el servidor. Sin este fallback, refrescar el navegador en cualquiera
  # de esas rutas devolvería 404 en vez de dejar que React Router la
  # resuelva del lado del cliente.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los archivos con hash en el nombre (los que genera `vite build` para
  # JS/CSS/assets) son inmutables: un cambio de contenido siempre produce
  # un nombre de archivo distinto, así que se pueden cachear de forma
  # agresiva sin riesgo de servir una versión vieja.
  location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, immutable";
  }

  # index.html sí cambia de contenido sin cambiar de nombre (referencia
  # los assets con hash actualizado en cada build): nunca debe quedar en
  # caché de navegador/CDN.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}

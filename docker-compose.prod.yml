# Definición de servicios para despliegue en un VPS con Dokploy o Coolify
# (Sprint 5 — ver docs/plan-portafolio.md, "Hosting", y docs/despliegue.md).
#
# Ambas plataformas soportan desplegar un proyecto "Docker Compose"
# directamente desde este archivo: apuntan el proyecto a este repo, a este
# path, y gestionan las variables de entorno (`env_file`/secretos) desde su
# propio panel en vez de un `.env` en el servidor.
#
# `apps/api` y `apps/web` se construyen con sus Dockerfiles ya existentes
# (`apps/api/Dockerfile`, `apps/web/Dockerfile`); el contexto de build es la
# raíz del repo en ambos casos (monorepo con npm workspaces, un solo
# package-lock.json). Ninguna credencial vive en este archivo: todo llega
# por variables de entorno que Dokploy/Coolify inyectan en runtime (o, para
# `VITE_API_URL`, como build arg — ver comentario en el servicio `web`).

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cvportafolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cvportafolio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cvportafolio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:?falta DATABASE_URL}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?falta FRONTEND_ORIGIN}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?falta AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?falta AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?falta S3_BUCKET_NAME}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-}
      # Fase 6 — variables que la API lee en runtime (ver docs/despliegue.md,
      # sección "Fase 6"):
      #   TRUST_PROXY: la API está detrás de Traefik (Dokploy/Coolify); con
      #     esto Express confía en X-Forwarded-For/-Proto para la IP real del
      #     cliente (rate limiting de login, logs) y la cookie `secure`.
      #   LOG_LEVEL: nivel de los logs JSON (pino): trace|debug|info|warn|error.
      #   THROTTLE_TTL_MS / THROTTLE_LIMIT: ventana y máximo de peticiones
      #     por IP del rate limiting global (120 req/min por defecto).
      TRUST_PROXY: ${TRUST_PROXY:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-120}
      THROTTLE_LOGIN_LIMIT: ${THROTTLE_LOGIN_LIMIT:-5}
      THROTTLE_LOGIN_TTL_MS: ${THROTTLE_LOGIN_TTL_MS:-60000}
      # Fase 8 (UC-27) — métricas de Umami en el panel (`GET /admin/metricas`).
      # Todas OPCIONALES: sin UMAMI_API_URL o UMAMI_WEBSITE_ID el endpoint
      # responde `{ disponible: false, motivo: 'no_configurado' }` y el resto
      # del panel no se entera. Umami se despliega aparte con
      # docker-compose.umami.yml (ver su cabecera y docs/despliegue.md §7.4).
      #   UMAMI_API_URL: URL de Umami sin barra final; la pública
      #     (https://analitica.<dominio>) es la opción simple.
      #   UMAMI_WEBSITE_ID: id del sitio creado en Umami (el mismo que
      #     VITE_UMAMI_WEBSITE_ID del build de `web`).
      #   Autenticación: UMAMI_API_TOKEN (Bearer) O BIEN
      #     UMAMI_USUARIO + UMAMI_CONTRASENA (login en /api/auth/login).
      UMAMI_API_URL: ${UMAMI_API_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_API_TOKEN: ${UMAMI_API_TOKEN:-}
      UMAMI_USUARIO: ${UMAMI_USUARIO:-}
      UMAMI_CONTRASENA: ${UMAMI_CONTRASENA:-}
    # Solo loopback: con TRUST_PROXY=true la API confía en X-Forwarded-For, así
    # que nadie debe poder llegar al puerto sin pasar por Traefik (revisión Fase 6).
    ports:
      - "127.0.0.1:${API_PUBLIC_PORT:-3000}:3000"
    # Fase 6 — liveness desde Compose (además del HEALTHCHECK de la imagen,
    # que Dokploy/Coolify ya respetan). `GET /health` no toca la base de
    # datos; `start_period` cubre el `prisma migrate deploy` del entrypoint.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # VITE_API_URL queda incrustado en el JS en tiempo de build (ver
      # apps/web/Dockerfile) — Dokploy/Coolify deben pasar este build arg
      # con la URL pública real de `api` (p. ej. https://api.tudominio.com)
      # antes de construir la imagen; no puede cambiarse luego en runtime.
      args:
        VITE_API_URL: ${VITE_API_URL:?falta VITE_API_URL}
        # Fase 8 (UC-27) — Umami, OPCIONAL y también en tiempo de build: si
        # alguna queda vacía el sitio sale sin tracker. Al activarlas hay que
        # reconstruir la imagen `web` (y poner ANALITICA_ORIGIN abajo).
        VITE_UMAMI_URL: ${VITE_UMAMI_URL:-}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
    restart: unless-stopped
    # Fase 6 — `web` espera a que `api` responda /health antes de arrancar:
    # así un despliegue nuevo no expone el frontend mientras la API todavía
    # está migrando la base de datos.
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Fase 6 — orígenes externos de la Content-Security-Policy de nginx
      # (apps/web/nginx/cabeceras-seguridad.conf). Se resuelven en RUNTIME
      # (envsubst de la imagen nginx), a diferencia de VITE_API_URL.
      #   API_ORIGIN: origen público de `api` (connect-src). Normalmente el
      #     mismo valor que VITE_API_URL, sin ruta ni barra final.
      #   MEDIA_ORIGIN: origen de S3 o CloudFront desde donde se incrustan
      #     los PDF (object-src/frame-src), p. ej.
      #     https://<bucket>.s3.<region>.amazonaws.com o https://<cloudfront>.
      # Si se dejan vacías, apps/web/docker-entrypoint.d/10-defaults.envsh
      # cae a `https:` (cualquier origen HTTPS) para no romper el sitio.
      API_ORIGIN: ${API_ORIGIN:-${VITE_API_URL}}
      MEDIA_ORIGIN: ${MEDIA_ORIGIN:-}
      # Fase 8 (UC-34) — SEO_UPSTREAM: URL interna del API a la que nginx hace
      # proxy para inyectar metadatos por SSI en index.html y servir
      # /sitemap.xml y /robots.txt. El default es el servicio `api` de este
      # mismo compose por la red interna de Docker; cambiarlo solo si el API
      # vive en otro stack/máquina. Sin barra final.
      SEO_UPSTREAM: ${SEO_UPSTREAM:-http://api:3000}
      # Fase 8 (UC-27) — ANALITICA_ORIGIN: origen público de Umami para la
      # CSP (script-src/connect-src). Vacío = sin analítica, CSP sin cambios.
      # Debe ser el mismo origen que VITE_UMAMI_URL del build arg de arriba.
      ANALITICA_ORIGIN: ${ANALITICA_ORIGIN:-}
    ports:
      - "${WEB_PUBLIC_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  postgres_data:
